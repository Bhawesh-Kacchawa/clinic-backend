spring:
  application:
    name: dental-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic_db}
    username: ${DB_USERNAME:clinic_user}
    password: ${DB_PASSWORD:clinic_user_1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Kolkata

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
